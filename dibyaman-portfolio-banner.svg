<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" from="0" to="430" dur="2s" begin="0.3s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="800" height="200" rx="12" fill="url(#bg)"/>
  <rect width="800" height="200" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Wave emoji -->
  <text x="40" y="55" font-size="20" fill="#c9d1d9">Hey, I'm Dibyaman 👋</text>

  <!-- Typing headline -->
  <g clip-path="url(#typeClip)">
    <text x="40" y="100" font-size="30" font-weight="700" fill="#58a6ff">Full-Stack Developer</text>
  </g>
  <!-- cursor -->
  <rect x="42" y="78" width="3" height="26" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="x" from="42" to="472" dur="2s" begin="0.3s" fill="freeze" calcMode="linear"/>
  </rect>

  <text x="40" y="130" font-size="14" fill="#8b949e" opacity="0">
    Java · Spring Boot · AWS · React
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2.4s" fill="freeze"/>
  </text>

  <!-- Cycling tech badges -->
  <g font-size="13" font-weight="600">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="6s" begin="3s" repeatCount="indefinite"/>
      <rect x="40" y="150" rx="14" ry="14" width="90" height="28" fill="#1f6feb"/>
      <text x="85" y="169" fill="#ffffff" text-anchor="middle">Java</text>
      <rect x="140" y="150" rx="14" ry="14" width="130" height="28" fill="#2ea043"/>
      <text x="205" y="169" fill="#ffffff" text-anchor="middle">Spring Boot</text>
      <rect x="280" y="150" rx="14" ry="14" width="90" height="28" fill="#d29922"/>
      <text x="325" y="169" fill="#ffffff" text-anchor="middle">AWS</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.55;0.95;1" dur="6s" begin="3s" repeatCount="indefinite"/>
      <rect x="40" y="150" rx="14" ry="14" width="110" height="28" fill="#8250df"/>
      <text x="95" y="169" fill="#ffffff" text-anchor="middle">MongoDB</text>
      <rect x="160" y="150" rx="14" ry="14" width="110" height="28" fill="#bf3989"/>
      <text x="215" y="169" fill="#ffffff" text-anchor="middle">PostgreSQL</text>
      <rect x="280" y="150" rx="14" ry="14" width="90" height="28" fill="#db6d28"/>
      <text x="325" y="169" fill="#ffffff" text-anchor="middle">Docker</text>
    </g>
  </g>

  <text x="760" y="190" font-size="10" fill="#484f58" text-anchor="end">bhubaneswar, odisha</text>
</svg>
